name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Icônes, permissions et signature
        run: |
          # Icônes de l'application et de la notification
          cp -r resources/android/res/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 - <<'PY'
          import re
          # Permissions Android (notifications, redémarrage du téléphone)
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          perms = ''.join(
              '    <uses-permission android:name="android.permission.%s" />\n' % p
              for p in ['POST_NOTIFICATIONS', 'RECEIVE_BOOT_COMPLETED', 'VIBRATE'])
          s = s.replace('</manifest>', perms + '</manifest>')
          open(m, 'w', encoding='utf-8').write(s)
          # Signature stable : permet de mettre à jour l'application sans la désinstaller
          g = 'android/app/build.gradle'
          s = open(g, encoding='utf-8').read()
          sign = '''android {
              signingConfigs {
                  debug {
                      storeFile file("../../keystore/amana.keystore")
                      storePassword "amana123"
                      keyAlias "amana"
                      keyPassword "amana123"
                  }
              }
          '''
          s = s.replace('android {\n', sign, 1)
          # Numéro de version qui augmente à chaque compilation
          import os
          n = os.environ.get('RUN_NUMBER', '1')
          s = re.sub(r'versionCode \d+', 'versionCode ' + n, s)
          s = re.sub(r'versionName "[^"]*"', 'versionName "1.' + n + '"', s)
          open(g, 'w', encoding='utf-8').write(s)
          PY
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AMANA-PACKAGING.apk

      - name: Publier l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: AMANA-PACKAGING-apk
          path: AMANA-PACKAGING.apk

      - name: Publier l'APK (Releases, si tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AMANA-PACKAGING.apk
